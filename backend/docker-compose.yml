# Backend + MongoDB (MongoDB is optional; auth falls back to an in-memory store).
# Run from this directory: docker compose up --build
services:
  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - path: ../.env
        required: false
    environment:
      - MONGO_URI=mongodb://mongo:27017
      - DB_NAME=cellularmaze
    depends_on:
      - mongo
    restart: unless-stopped

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

volumes:
  mongo_data:
