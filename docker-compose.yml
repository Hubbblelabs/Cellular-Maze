services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: cellularmaze-backend
    # Optional API keys (TomTom, OpenCelliD, OpenWeather, SECRET_KEY) -- the
    # app runs without them using OSRM roads and bundled tower data.
    env_file:
      - path: .env
        required: false
    environment:
      CORS_ORIGIN: http://localhost:3000
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    image: node:20-alpine
    container_name: cellularmaze-frontend
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --hostname 0.0.0.0 --port 3000"
    environment:
      # Browser-side URL of the backend
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_MAPBOX_TOKEN: ${NEXT_PUBLIC_MAPBOX_TOKEN:-}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - backend
